aid: fossil-scm

name: Fossil SCM

description: Fossil SCM is an open-source, distributed version control system that includes an integrated bug tracking, wiki, and web interface.
  It provides a self-contained, easy-to-deploy solution for software configuration management, suitable for both small projects and large codebases.
  The system emphasizes simplicity, reliability, and a single-file repository model, making it a coherent alternative to other SCM tools.

